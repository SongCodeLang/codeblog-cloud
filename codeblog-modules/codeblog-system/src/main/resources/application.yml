server:
  port: 48081

spring:
  application:
    name: codeblog-system
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/codeblog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "root"
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      validation-query: SELECT 1
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

# Sa-Token：与网关保持一致，Authorization: Bearer <token>
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-log: false

codeblog:
  security:
    enabled: true
    excludes:
      - /auth/login
      - /doc.html
      - /webjars/**
      - /v3/api-docs/**
      - /favicon.ico
  mybatis:
    audit-console-enabled: false

mybatis-flex:
  mapper-locations: classpath*:mapper/**/*.xml

springdoc:
  api-docs:
    enabled: true
knife4j:
  enable: true
  setting:
    language: zh_cn
