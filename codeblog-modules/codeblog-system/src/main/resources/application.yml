server:
  port: 48081

spring:
  application:
    name: codeblog-system
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
    stream:
      # RocketMQ binder（SCA stream）：登录事件收发（后续业务绑定陆续扩展）
      bindings:
        loginEvent-out-0:
          destination: codeblog-login-event
        loginEvent-in-0:
          destination: codeblog-login-event
          group: codeblog-system
      rocketmq:
        binder:
          # 开发联调直连宿主机端口；生产由 Nacos 配置中心覆盖
          name-server: 127.0.0.1:9876
    sentinel:
      eager: true
      transport:
        dashboard: 127.0.0.1:8858
      # 规则持久化：dataId 约定 {service}-{ruleType}-rules，在 Nacos 控制台编辑，服务监听热加载
      datasource:
        flow-rules:
          nacos:
            server-addr: 127.0.0.1:8848
            data-id: codeblog-system-flow-rules
            rule-type: flow
        degrade-rules:
          nacos:
            server-addr: 127.0.0.1:8848
            data-id: codeblog-system-degrade-rules
            rule-type: degrade
  servlet:
    # 上传大小显式限制（阶段4；File 存储抽象随阶段6 落地后真正用到）
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/codeblog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "root"
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      validation-query: SELECT 1
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

# Sa-Token：与网关保持一致，Authorization: Bearer <token>
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000
  active-timeout: 259200  # 3 天无操作过期（安全加固：token 泄漏的最大暴露窗口）
  is-concurrent: true
  is-log: false

codeblog:
  security:
    enabled: true
    excludes:
      - /auth/login
      - /doc.html
      - /webjars/**
      - /v3/api-docs/**
      - /favicon.ico
      - /actuator/**
  mybatis:
    audit-console-enabled: false

mybatis-flex:
  mapper-locations: classpath*:mapper/**/*.xml

# Seata 分布式事务（阶段2 就绪先行，AT 模式；跨服务写才用 @GlobalTransactional）
# 开发联调走 docker 端口映射直连；生产同网络部署时改 registry.type=nacos 发现 seata-server
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: codeblog_tx_group
  service:
    vgroup-mapping:
      codeblog_tx_group: default
    grouplist:
      default: 127.0.0.1:8091
  registry:
    type: file
  config:
    type: file

springdoc:
  api-docs:
    enabled: true
knife4j:
  enable: true
  setting:
    language: zh_cn

# 健康端点（服务直连 48081，探测免登录；经网关访问需网关侧白名单放行）
management:
  endpoints:
    web:
      exposure:
        include: health,info

---
# Nacos 配置规范化（阶段2）：共享配置 + 服务私有配置；仅在非 local profile 生效。
# 注意：config.import 是跨文档追加语义（profile 文档覆盖不了主文档的 import），
# 因此必须用条件文档隔离，local 下完全不触发 Nacos 客户端。
spring:
  config:
    activate:
      on-profile: "!local"
    import:
      - optional:nacos:application-common.yaml
      - optional:nacos:codeblog-system.yaml
