services:
  mysql:
    image: mysql:8.4
    container_name: codeblog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: codeblog
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行系统管理服务初始化脚本
      - ../codeblog-modules/codeblog-system/sql/init.sql:/docker-entrypoint-initdb.d/01_system.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7.4
    container_name: codeblog-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: codeblog-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"

  # Sentinel 控制台（Dashboard 1.8.10 内核）：监控视图 + 临时推送；
  # 持久化规则一律在 Nacos 控制台编辑 dataId {service}-{ruleType}-rules，服务端监听加载
  sentinel-dashboard:
    image: bladex/sentinel-dashboard:latest
    container_name: codeblog-sentinel-dashboard
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8858:8858"

  # Seata TC 协调器（Apache Seata 2.5.0，与 SCA 2025.0.0.0 客户端严格配套）
  # 控制台 7091 / 事务端口 8091；存储 file 模式起步，生产切 db；注册进 Nacos（SEATA_GROUP）
  seata-server:
    image: apache/seata-server:2.5.0
    container_name: codeblog-seata-server
    restart: unless-stopped
    depends_on:
      - nacos
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./seata/application.yml:/seata-server/resources/application.yml:ro
    ports:
      - "7091:7091"
      - "8091:8091"

  # RocketMQ NameServer（Apache RocketMQ 5.3.1，与 SCA 2025.0.0.0 binder 内的 client 5.3.1 配套）
  # 开发联调内存受限，显式压缩 JVM 堆（镜像默认 8G）
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: codeblog-rocketmq-namesrv
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    command: ["sh", "mqnamesrv"]
    ports:
      - "9876:9876"

  # RocketMQ Broker：brokerIP1=127.0.0.1（同 Seata grouplist 理由——容器 IP 宿主机不可达，
  # 宿主机客户端凭注册地址 127.0.0.1:10911 直连；代价是 compose 内部容器访问 broker 受限）；
  # autoCreateTopicEnable=true 仅为开发便利，生产环境显式建 topic 并关掉
  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: codeblog-rocketmq-broker
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    environment:
      TZ: Asia/Shanghai
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn128m"
    command: ["sh", "mqbroker", "-n", "rocketmq-namesrv:9876", "-c", "/home/rocketmq/conf/broker.conf"]
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      # 注：不挂 store 卷——命名卷会以 root 属主初始化，镜像内 broker 用户(uid 3000)不可写导致启动失败；
      # 开发环境存储随容器（重建即清空）。生产自建编排时挂卷后需 chown 3000:3000 或以 root 运行
    ports:
      - "10909:10909"
      - "10911:10911"

  # RocketMQ 控制台（监控视图定位，同 Sentinel Dashboard）：宿主机访问 http://127.0.0.1:8180
  rocketmq-dashboard:
    image: apache/rocketmq-dashboard:1.1.0
    container_name: codeblog-rocketmq-dashboard
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876"
    ports:
      - "8180:8080"

volumes:
  mysql-data:
  redis-data:
