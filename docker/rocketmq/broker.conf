# RocketMQ Broker 开发联调配置（宿主机客户端直连场景）
# brokerIP1 必须显式指定：默认注册容器 IP，Docker Desktop 下宿主机不可达
# （同 Seata grouplist 直连 127.0.0.1 的理由，见 docs/ARCHITECTURE.md 12.3/12.5）
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerIP1 = 127.0.0.1
listenPort = 10911
deleteWhen = 04
fileReservedTime = 48
# 开发便利：自动创建 topic；生产环境显式建 topic 并置 false
autoCreateTopicEnable = true
# 刷盘：开发环境异步提速
flushDiskType = ASYNC_FLUSH
