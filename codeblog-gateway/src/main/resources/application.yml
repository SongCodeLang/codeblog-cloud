server:
  port: 9999

spring:
  application:
    name: codeblog-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
    sentinel:
      eager: true
      transport:
        dashboard: 127.0.0.1:8858
      # 网关流控规则（gw-flow：路由 id / API 分组维度），Nacos 持久化
      datasource:
        gw-flow-rules:
          nacos:
            server-addr: 127.0.0.1:8848
            data-id: codeblog-gateway-gwflow-rules
            rule-type: gw-flow
    gateway:
      server:
        webflux:
          routes:
            # 系统管理服务：前端访问 /system/**，去除一级前缀后转发
            - id: codeblog-system
              uri: lb://codeblog-system
              predicates:
                - Path=/system/**
              filters:
                - StripPrefix=1
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

# Sa-Token：统一使用 Authorization: Bearer <token> 头
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000
  active-timeout: 259200  # 3 天无操作过期（安全加固：token 泄漏的最大暴露窗口）
  is-concurrent: true
  is-log: false

codeblog:
  gateway:
    # 网关统一鉴权
    security:
      enabled: true
      excludes:
        - /system/auth/login
        # 网关白名单匹配的是带路由前缀的原始路径（AGENTS 已知坑 4）；
        # /doc.html 等服务侧路径经网关访问时永远带 /system 前缀
        - /system/doc.html
        - /system/webjars/**
        - /system/v3/api-docs/**
        - /actuator/**
        - /favicon.ico
    # 跨域（开发期建议走前端代理，此配置用于直连场景）
    # 阶段4 收紧：由 * 改为显式来源清单（allow-credentials=true 时浏览器本就拒绝通配符 Origin）
    cors:
      allowed-origins:
        - http://localhost:5173
        - http://127.0.0.1:5173
      allow-credentials: true
      max-age: 3600

# 健康端点（网关自身 9999，已入鉴权白名单）
management:
  endpoints:
    web:
      exposure:
        include: health,info

---
# Nacos 配置规范化（阶段2）：共享配置 + 服务私有配置；仅在非 local profile 生效。
# config.import 是跨文档追加语义，必须用条件文档隔离（同 codeblog-system 的处理）。
spring:
  config:
    activate:
      on-profile: "!local"
    import:
      - optional:nacos:application-common.yaml
      - optional:nacos:codeblog-gateway.yaml
