server:
  port: 9999

spring:
  application:
    name: codeblog-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
    gateway:
      server:
        webflux:
          routes:
            # 用户服务：前端访问 /user/**，去除一级前缀后转发
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/user/**
              filters:
                - StripPrefix=1
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

# Sa-Token：统一使用 Authorization: Bearer <token> 头
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-log: false

codeblog:
  gateway:
    # 网关统一鉴权
    security:
      enabled: true
      excludes:
        - /user/auth/login
        - /doc.html
        - /webjars/**
        - /v3/api-docs/**
        - /actuator/**
        - /favicon.ico
    # 跨域（开发期建议走前端代理，此配置用于直连场景）
    cors:
      allowed-origins:
        - "*"
      allow-credentials: true
      max-age: 3600
